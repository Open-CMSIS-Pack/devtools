ctrace-run:
  ctrace-setup:
    - timestamps:
        clock: 280000000
        itm-prescaler: 1
  ctrace-refs:
    - ctrace-ref: timestamps
      type: itm
    - ctrace-ref: data#0
      type: dwt
      source: 0
      address: 0x2404AEA4
      size: 4
      data-type: unsigned
      label: Sine
    - ctrace-ref: data#1
      type: dwt
      source: 1
      address: 0x2404AEA0
      size: 4
      data-type: unsigned
      label: Rectangle
    - ctrace-ref: data#2
      type: dwt
      source: 2
      address: 0x2404AE9C
      size: 4
      data-type: unsigned
      label: Random
    - ctrace-ref: data#3
      type: dwt
      source: 3
      address: 0x24000E88
      size: 4
      data-type: unsigned
      label: Current
