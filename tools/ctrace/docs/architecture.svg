  <text x="1040" y="428" class="box-title">diagnostics</text>
  <text x="1040" y="451" class="box-detail">severity · context · impact</text>
  <text x="1040" y="469" class="box-detail">CLI/config · decoder · output failures</text>
  <text x="1040" y="487" class="box-detail">native errors · packet preview · recovery</text>

