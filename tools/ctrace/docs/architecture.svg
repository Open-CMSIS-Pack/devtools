  <rect x="60" y="595" width="230" height="90" class="box decode"/>
  <text x="175" y="623" class="box-title">DecodePipeline</text>
  <text x="175" y="646" class="box-detail">borrowed RawByteView chunks</text>
  <text x="175" y="664" class="box-detail">finish flushes both layers</text>

  <rect x="335" y="585" width="290" height="110" class="box decode"/>
