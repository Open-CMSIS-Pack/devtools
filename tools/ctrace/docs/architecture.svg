<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1240" viewBox="0 0 1280 1240" role="img"
     aria-labelledby="title description">
  <title id="title">ctrace software architecture</title>
  <desc id="description">
    ITM and DWT runtime data flow from command-line, trace-run YAML, and one selected raw input through a channel-based
    format default or explicit override, normalized routes, mode-specific output planning, a SINGLE or formatted
    OpenCSD DecodeTree, route-local recovery and
    Cortex-M state, semantic trace events, diagnostics, CSV, multi-stream CTF, and conditional Trace Compass XML
    output. Native errors, bounded packet previews, and recovery details reach diagnostics and CSV. Formatter and
    initial synchronization skips follow a separate Info path. Fatal decode retains committed CSV rows with a global
    abort record and removes incomplete CTF and XML artifacts.
  </desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34495e"/>
    </marker>
    <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#66788a"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#102a43" flood-opacity="0.14"/>
    </filter>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #102a43; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 14px; fill: #52667a; }
      .section { font-size: 14px; font-weight: 700; letter-spacing: 1.2px; fill: #52667a; }
      .box { stroke-width: 1.5; rx: 9; filter: url(#shadow); }
      .box-title { font-size: 16px; font-weight: 700; text-anchor: middle; }
      .box-detail { font-size: 12px; text-anchor: middle; fill: #52667a; }
      .input { fill: #f1f7ff; stroke: #4c8eda; }
      .control { fill: #f2fbf7; stroke: #37a779; }
      .decode { fill: #fff8e8; stroke: #d89a22; }
      .model { fill: #f8f1ff; stroke: #9467bd; }
      .output { fill: #fff2f3; stroke: #d65c67; }
      .support { fill: #f4f6f8; stroke: #8395a7; }
      .external { fill: #ffffff; stroke: #8395a7; stroke-dasharray: 5 4; }
      .flow { fill: none; stroke: #34495e; stroke-width: 2.2; marker-end: url(#arrow); }
      .dependency { fill: none; stroke: #66788a; stroke-width: 1.8; stroke-dasharray: 7 5;
                    marker-end: url(#arrow-muted); }
      .conditional { fill: none; stroke: #66788a; stroke-width: 1.8; stroke-dasharray: 2 5;
                     marker-end: url(#arrow-muted); }
      .flow, .dependency, .conditional { stroke-linecap: round; stroke-linejoin: round; }
      .group { fill: none; stroke: #d5dde5; stroke-width: 1.2; rx: 14; }
      .legend { font-size: 12px; fill: #52667a; }
    </style>
  </defs>

