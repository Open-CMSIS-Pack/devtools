  <text x="800" y="759" class="box-title">TraceByteSkip</text>
  <text x="800" y="779" class="box-detail">Info · observed ID · no time</text>

  <rect x="965" y="735" width="250" height="58" class="box control"/>
  <text x="1090" y="759" class="box-title">DecodeConsumers</text>
  <text x="1090" y="779" class="box-detail">synchronous output / issue fan-out</text>

