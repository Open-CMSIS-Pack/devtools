  <text x="155" y="176" class="box-detail">mode · target</text>
  <text x="155" y="194" class="box-detail">type / stream filters</text>

  <rect x="310" y="125" width="250" height="86" class="box input"/>
  <text x="435" y="153" class="box-title">*.ctrace-run.yml</text>
  <text x="435" y="176" class="box-detail">optional trace-format · ctrace-setup</text>
  <text x="435" y="194" class="box-detail">ctrace-refs · optional metadata</text>

  <rect x="610" y="125" width="220" height="86" class="box input"/>
  <text x="720" y="153" class="box-title">*.SWO.raw</text>
  <text x="720" y="176" class="box-detail">default: unformatted</text>
  <text x="720" y="194" class="box-detail">explicit format overrides</text>

