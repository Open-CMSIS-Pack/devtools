# yaml-language-server: $schema=https://raw.githubusercontent.com/Open-CMSIS-Pack/devtools/main/tools/projmgr/schemas/cproject.schema.json

project:
  components:
    - component: RteTestGenerator:Check Global Generator

  setups:
    - setup: AC6 misc options
      for-compiler: AC6
      misc:
        - C:
            - --setup-misc=./relative/from-setup

  groups:
    - group: sources
      files: 
        - file: main.c

  generators:
    options:
      - generator: RteTestExternalGenerator
        path: $ProjectDir()$/generated/

