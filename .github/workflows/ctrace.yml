name: ctrace
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ctrace.yml'
      - '.github/workflows/shared_matrix_prep.yml'
      - '.github/workflows/shared_setup_env.yml'
      - '.github/matrix_includes_ctrace.json'
      - '.gitmodules'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'external/OpenCSD'
      - 'external/cxxopts'
      - 'external/cxxopts.patch'
      - 'external/yaml-cpp'
      - 'external/yaml-cpp.patch'
      - 'tools/ctrace/**'
      - '!**/docs/**/*'
      - '!**/*.md'
  pull_request:
    paths:
      - '.github/workflows/ctrace.yml'
      - '.github/workflows/shared_matrix_prep.yml'
      - '.github/workflows/shared_setup_env.yml'
      - '.github/matrix_includes_ctrace.json'
      - '.gitmodules'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'external/OpenCSD'
      - 'external/cxxopts'
      - 'external/cxxopts.patch'
      - 'external/yaml-cpp'
      - 'external/yaml-cpp.patch'
      - 'tools/ctrace/**'
      - '!**/docs/**/*'
      - '!**/*.md'
  release:
    types: [published]

concurrency:
  group: ctrace-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  setup:
    uses: ./.github/workflows/shared_setup_env.yml
    with:
      run_if: ${{ (github.event_name == 'pull_request') || (github.event_name == 'workflow_dispatch') || (github.event_name == 'release' && startsWith(github.ref, 'refs/tags/tools/ctrace/')) || ((github.event.schedule != '') && (!github.event.repository.private)) }}

  matrix_prep:
    needs: setup
    uses: ./.github/workflows/shared_matrix_prep.yml
    with:
      workflow_name: ctrace

  build:
    needs: [ setup, matrix_prep ]
    runs-on: ${{ matrix.runs_on }}
    name: build (${{ matrix.runs_on }}, ${{ matrix.arch }})
    timeout-minutes: 25
    strategy:
      fail-fast: true
      matrix: ${{ fromJson(needs.matrix_prep.outputs.matrix) }}
    steps:
      - name: Harden Runner
        if: ${{ !github.event.repository.private }}
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout devtools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 0

      # https://github.com/Open-CMSIS-Pack/devtools-build-action
      - name: Build
        uses: Open-CMSIS-Pack/devtools-build-action@5b24a2b5145eb406a664269b3704bb983c19242d # arm64
        with:
          target: ctrace
          arch: ${{ matrix.arch }}

      - name: Run ctrace integration tests
        if: (matrix.target != 'windows' || matrix.arch != 'arm64')
        run: ctest -V -C Release -R '^ctrace-'
        working-directory: ./build

      - name: Verify Windows Arm64 binary architecture
        if: (matrix.target == 'windows' && matrix.arch == 'arm64')
        shell: pwsh
        run: |
          $binaryPath = "./build/tools/ctrace/${{ matrix.target }}-${{ matrix.arch }}/Release/${{ matrix.binary }}"
          $bytes = [System.IO.File]::ReadAllBytes($binaryPath)
          if ($bytes.Length -lt 64) {
            throw "ctrace.exe is too short to contain a valid PE header"
          }
          $peOffset = [System.BitConverter]::ToUInt32($bytes, 0x3c)
          if ($peOffset + 6 -gt $bytes.Length) {
            throw "ctrace.exe contains an invalid PE header offset"
          }
          $signature = [System.Text.Encoding]::ASCII.GetString($bytes, $peOffset, 4)
          $machine = [System.BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($signature -ne "PE`0`0" -or $machine -ne 0xAA64) {
            throw "ctrace.exe is not an Arm64 PE binary (machine 0x$($machine.ToString('X4')))"
          }

      - name: Install strip tools
        if: |
          github.event_name == 'release' &&
          matrix.arch == 'arm64' &&
          startsWith(matrix.runs_on, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install binutils-aarch64-linux-gnu

      - name: Strip ctrace release binary
        if: |
          github.event_name == 'release' &&
          (startsWith(matrix.runs_on, 'macos') || startsWith(matrix.runs_on, 'ubuntu'))
        run: |
          binary_path="./build/tools/ctrace/${{ matrix.target }}-${{ matrix.arch }}/Release/${{ matrix.binary }}"
          echo "Stripping binary at: $binary_path"
          if [[ "${{ matrix.arch }}" == "arm64" && "${{ matrix.target }}" == "linux" ]]; then
            aarch64-linux-gnu-strip "$binary_path"
          else
            strip "$binary_path"
          fi

      - name: Smoke-test release binary
        if: |
          github.event_name == 'release' &&
          (matrix.target != 'windows' || matrix.arch != 'arm64')
        shell: bash
        run: |
          binary_path="./build/tools/ctrace/${{ matrix.target }}-${{ matrix.arch }}/Release/${{ matrix.binary }}"
          if [[ "${{ matrix.target }}" == "linux" && "${{ matrix.arch }}" == "arm64" ]]; then
            qemu-aarch64 -L /usr/aarch64-linux-gnu "$binary_path" --version
          else
            "$binary_path" --version
          fi

      - name: Archive ctrace
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ctrace-${{ matrix.target }}-${{ matrix.arch }}
          path: ./build/tools/ctrace/${{ matrix.target }}-${{ matrix.arch }}/Release/${{ matrix.binary }}
          retention-days: ${{ needs.setup.outputs.retention_days }}
          if-no-files-found: error

  release:
    if: |
      github.event_name == 'release' &&
      startsWith(github.ref, 'refs/tags/tools/ctrace/')
    needs: [ build, unittest, coverage ]
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Checkout devtools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Create distribution folders
        run: |
          mkdir -p tools/ctrace/distribution/bin
          mkdir -p tools/ctrace/distribution/THIRD_PARTY_LICENSES
          cp LICENSE tools/ctrace/distribution/LICENSE.txt
          cp tools/ctrace/docs/THIRD_PARTY_NOTICES.md tools/ctrace/distribution/
          cp external/cxxopts/LICENSE tools/ctrace/distribution/THIRD_PARTY_LICENSES/cxxopts.txt
          cp external/yaml-cpp/LICENSE tools/ctrace/distribution/THIRD_PARTY_LICENSES/yaml-cpp.txt
          cp external/OpenCSD/LICENSE tools/ctrace/distribution/THIRD_PARTY_LICENSES/OpenCSD.txt

      - name: Download ctrace linux-amd64
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ctrace-linux-amd64
          path: tools/ctrace/distribution/bin/linux-amd64/

      - name: Download ctrace linux-arm64
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ctrace-linux-arm64
          path: tools/ctrace/distribution/bin/linux-arm64/

      - name: Download ctrace macos-arm64
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ctrace-darwin-arm64
          path: tools/ctrace/distribution/bin/darwin-arm64/

      - name: Download ctrace windows-amd64
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ctrace-windows-amd64
          path: tools/ctrace/distribution/bin/windows-amd64/

      - name: Download ctrace windows-arm64
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ctrace-windows-arm64
          path: tools/ctrace/distribution/bin/windows-arm64/

      - name: Set Unix executable permissions
        run: |
          chmod +x bin/darwin-arm64/ctrace
          chmod +x bin/linux-amd64/ctrace
          chmod +x bin/linux-arm64/ctrace
        working-directory: tools/ctrace/distribution

      - name: Verify and zip distribution
        run: |
          find bin THIRD_PARTY_LICENSES -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum LICENSE.txt THIRD_PARTY_NOTICES.md >> SHA256SUMS
          sha256sum --check SHA256SUMS
          zip -r ctrace.zip bin LICENSE.txt THIRD_PARTY_LICENSES THIRD_PARTY_NOTICES.md SHA256SUMS
          sha256sum ctrace.zip > ctrace.zip.sha256
        working-directory: tools/ctrace/distribution

      - name: Attach zip archive to release assets
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: tools/ctrace/distribution/ctrace.zip
          tag: ${{ github.ref }}
          overwrite: true
          asset_name: ctrace.zip

      - name: Attach archive checksum to release assets
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: tools/ctrace/distribution/ctrace.zip.sha256
          tag: ${{ github.ref }}
          overwrite: true
          asset_name: ctrace.zip.sha256

  unittest:
    needs: [ setup, matrix_prep ]
    name: unittest (${{ matrix.runs_on }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 25
    strategy:
      fail-fast: true
      matrix: ${{ fromJson(needs.matrix_prep.outputs.matrix) }}
    steps:
      - name: Harden Runner
        if: ${{ !github.event.repository.private }}
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout devtools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      # https://github.com/Open-CMSIS-Pack/devtools-build-action
      - name: Build CtraceUnitTests
        uses: Open-CMSIS-Pack/devtools-build-action@5b24a2b5145eb406a664269b3704bb983c19242d # arm64
        with:
          target: CtraceUnitTests
          build_type: Debug
          arch: ${{ matrix.arch }}

      - name: Run ctrace unit tests
        if: (matrix.target != 'windows' || matrix.arch != 'arm64')
        run: ctest -C Debug -R CtraceUnitTests
        working-directory: ./build

      - name: Archive unit tests results
        if: always() && (matrix.target != 'windows' || matrix.arch != 'arm64')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit_test_result_ctrace-${{ matrix.target }}-${{ matrix.arch }}
          path: ./build/test_reports/CtraceUnitTests.*.xml
          retention-days: ${{ needs.setup.outputs.retention_days }}
          if-no-files-found: error

  coverage:
    if: |
      (github.event_name == 'pull_request') ||
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'push') ||
      (github.event_name == 'release' && startsWith(github.ref, 'refs/tags/tools/ctrace/')) ||
      ((github.event.schedule != '') && (!github.event.repository.private))
    env:
      lcov_base: https://github.com/linux-test-project/lcov/releases/download/v1.15/
      lcov_installer: lcov-1.15.tar.gz
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Harden Runner
        if: ${{ !github.event.repository.private }}
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Install linux deps
        run: |
          sudo apt-get update
          sudo apt-get install lcov

      - name: Checkout devtools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      # https://github.com/Open-CMSIS-Pack/devtools-build-action
      - name: Build CtraceUnitTests
        uses: Open-CMSIS-Pack/devtools-build-action@5b24a2b5145eb406a664269b3704bb983c19242d # arm64
        with:
          add_cmake_variables: -DCOVERAGE=ON
          arch: amd64
          build_type: Debug
          target: CtraceUnitTests

      - name: Build ctrace integration target
        run: cmake --build . --target ctrace
        working-directory: ./build

      - name: Run ctrace tests
        run: ctest -V -C Debug -R '^(CtraceUnitTests|ctrace-)'
        working-directory: ./build

      - name: Get retention days
        id: var
        run: |
          echo "retention_days=$(echo '${{ (!github.event.repository.private && (github.event_name == 'push' || github.event.schedule != '')) && '7' || '1' }}')" >> $GITHUB_OUTPUT

      - name: Archive unit tests results
        if: (github.event_name == 'push')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit_test_result_ctrace-linux-amd64
          path: ./build/test_reports/CtraceUnitTests.*.xml
          retention-days: ${{ steps.var.outputs.retention_days }}
          if-no-files-found: error

      - name: Setup lcov1.15
        run: |
          wget -q ${{ env.lcov_base }}/${{ env.lcov_installer }}
          tar -xvf ${{ env.lcov_installer }}
        working-directory: ./build/tools/ctrace

      - name: Generate coverage report
        run: |
          lcov-1.15/bin/lcov --rc lcov_branch_coverage=1 --rc geninfo_no_exception_branch=1 -c --directory . --output-file full_coverage.info
          lcov-1.15/bin/lcov --rc lcov_branch_coverage=1 --rc geninfo_no_exception_branch=1 -e full_coverage.info '*/tools/ctrace/src/*' -o coverage_ctrace.info
          genhtml coverage_ctrace.info --output-directory coverage_ctrace --branch-coverage
        working-directory: ./build/tools/ctrace

      - name: Upload Report to Codecov
        if: ${{ !github.event.repository.private }}
        uses: Wandalen/wretry.action@e68c23e6309f2871ca8ae4763e7629b9c258e1ea # v3.8.0
        with:
          action: codecov/codecov-action@v4
          with: |
            files: ./build/tools/ctrace/coverage_ctrace.info
            fail_ci_if_error: true
            flags: ctrace-cov
            token: ${{ secrets.CODECOV_TOKEN }}
            verbose: true
          attempt_limit: 3
          attempt_delay: 5000

      - name: Archive coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report-ctrace
          path: |
            ./build/tools/ctrace/coverage_ctrace/
            ./build/tools/ctrace/coverage_ctrace.info
          retention-days: ${{ steps.var.outputs.retention_days }}
          if-no-files-found: error

  test-results-preparation:
    name: "Publish Tests Results"
    if: ${{ always() }}
    needs: [ unittest ]
    runs-on: ubuntu-22.04
    steps:
      - name: Harden Runner
        if: ${{ !github.event.repository.private }}
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Event File
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Event File ctrace
          path: ${{ github.event_path }}
