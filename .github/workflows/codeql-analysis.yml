name: "CodeQL"

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/codeql-analysis.yml'
      - '**/*.c'
      - '**/*.cpp'
      - '**/*.h'
      - '**/*.in'
      - '**/CMakeLists.txt'
      - '!**/*.md'
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: read

    steps:
      - name: Install packages
        run: |
          sudo apt-get install ninja-build

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: cpp
          build-mode: manual
          config-file: ./.github/codeql-config.yml

      - name: Create build folder
        run: mkdir build

      - name: Build code for analysis
        run: |
          cmake -G Ninja ..
          cmake --build .
        working-directory: ./build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: .github/workflows/codeql-analysis.yml:analyze
          output: sarif-results
          upload: never

      - name: Exclude third-party CodeQL results
        run: |
          set -euo pipefail
          mkdir sarif-results-filtered
          find sarif-results -type f -name '*.sarif' -print0 | while IFS= read -r -d '' sarif_file; do
            jq '
              def is_external_path:
                (. // "" | gsub("\\\\"; "/") | test("(^|/)(\\./)?external(/|$)"));
              .runs |= map(
                .results |= map(
                  select(
                    (.locations[0].physicalLocation.artifactLocation.uri // "")
                    | is_external_path
                    | not
                  )
                )
              )
            ' "$sarif_file" > "sarif-results-filtered/$(basename "$sarif_file")"
          done

      - name: Upload filtered CodeQL results
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: .github/workflows/codeql-analysis.yml:analyze
          sarif_file: sarif-results-filtered
